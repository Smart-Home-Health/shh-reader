name: Publish image

# Builds the deployable reader image and pushes it to GHCR on every version
# tag, so users can pull ghcr.io/smart-home-health/shh-reader in a compose
# file instead of cloning the repo. Multi-arch: amd64 (PCs/servers) + arm64
# (Raspberry Pi and friends). Uses the built-in GITHUB_TOKEN — no extra
# secrets, same as the platform repo.
#
# workflow_dispatch publishes :latest from whatever ref it runs on (semver
# tags only appear on v* tag pushes).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3        # arm64 emulation
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases this to ghcr.io/smart-home-health/shh-reader
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
