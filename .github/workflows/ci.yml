name: CI

# Runs the reader test suite on every push to a long-lived branch and on
# every PR — same trigger shape as the platform repo. A second job verifies
# the Docker image still builds, since deploys bake code into the image
# (docker compose up -d --build).
on:
  push:
    branches: [main, "dev/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Matches the python:3.12-slim Docker base image
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t shh-reader-ci .
